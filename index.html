// ---- canvas scaling ----
function fit(){

  let w = window.innerWidth, h = window.innerHeight;
  if (w/h > a) w = h*a; else h = w/a;
  cv.style.width = w+'px'; cv.style.height = h+'px';
}
window.addEventListener('resize', fit); fit();

let AC = null, murmurOn = false;
function audioInit(){
  if (AC){
    if (AC.state === 'suspended') AC.resume(); // iOS unlock
    return;
  }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){}
  if (AC && AC.state === 'suspended') AC.resume();
  startMurmur();
}
function tone(freq, dur, type, vol, slide){
  if (!AC) return;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, AC.currentTime);
  if (slide) o.frequency.linearRampToValueAtTime(Math.max(30, freq+slide), AC.currentTime+dur);
  g.gain.setValueAtTime(vol || 0.2, AC.currentTime);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
  o.connect(g); g.connect(AC.destination);
  o.start(); o.stop(AC.currentTime+dur);
}
function noise(dur, vol, filt, attack){
  if (!AC) return;
  const n = AC.sampleRate * dur, buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = Math.random()*2-1;
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value = filt || 1200;
  const g = AC.createGain();
  const a = attack || 0.01;
  g.gain.setValueAtTime(0.001, AC.currentTime);
  g.gain.linearRampToValueAtTime(vol || 0.2, AC.currentTime + a);
  g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime + dur);
  src.connect(f); f.connect(g); g.connect(AC.destination);
  src.start();
}
function startMurmur(){
  if (!AC || murmurOn) return;
  murmurOn = true;
  const n = AC.sampleRate * 2, buf = AC.createBuffer(1, n, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<n;i++) d[i] = Math.random()*2-1;
  const src = AC.createBufferSource(); src.buffer = buf; src.loop = true;
  const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value = 350;
  const g = AC.createGain(); g.gain.value = 0.025;
  src.connect(f); f.connect(g); g.connect(AC.destination);
  src.start();
}

  for (let i=0;i<zones.length;i++){
    const z = zones[i];
    arr.push({x0:z[0], x1:z[1], x:(z[0]+z[1])/2, dir: i%2?1:-1, speed:P.stickSpeed*(0.8+0.4*Math.random()), num:nums[i], skin:skins[i]});
  }
  return arr;
}

const BRUNSON_X = 230;
function spawnShot(){
  // the ball leaves Brunson's follow-through hand
  ball = {x:BRUNSON_X+30, y:FLOOR-130, vx:0, vy:0, live:true, tipped:false, hitRim:false, made:false, tipCd:0};
  const T = 1.05;
  const tx = RIM_FRONT - 4 + Math.random()*26, ty = RIM_Y - 8;
  ball.vx = (tx - ball.x)/T;
  ball.vy = (ty - ball.y)/T - 0.5*BALL_G*T;
}

function resetTry(){
  triesUsed++; // counts attempts started, so the HUD bumps on reset
  og = {x:50, y:FLOOR, vx:0, vy:0, air:false, facing:1, stun:0, phase:0};
  wemby = {x:660, y:FLOOR, vy:0, air:false, cd:0};
  spawnShot();
  state = 'play';
}

function startGame(){
  triesUsed = 0;
  pops = []; replayBuf = [];
  sticks = makeSticks();
  resetTry();
}

function endTry(result){
  ball.live = false;
  resolveTimer = 1.5;
  state = 'resolve';
  if (result === 'block'){
    addPop(Math.random()<0.5 ? 'BLOCKED BY WEMBY!' : 'NOT IN MY HOUSE!', W/2, 200, 46, '#222', 1.4);
    sSwat();
  } else {
    addPop(pick(FAIL_TEXT), W/2, 200, 40, '#d22', 1.4);
  }
}
const pick = a => a[(Math.random()*a.length)|0];
const FAIL_TEXT = [
  'SAME OLD KNICKS...',
  'THE GARDEN GOES QUIET...',
  'TAKING THE 7 TRAIN HOME...'
];

function makeShot(){

// ===== Input =====
function pressJump(){
  audioInit();
  if (state === 'title' || state === 'victory'){ startGame(); }
  else if (state === 'play' || state === 'resolve'){
    if (!og.air && og.stun <= 0){ og.vy = -950; og.air = true; sBoing(); }
  }
}

const KEYMAP = {KeyA:'ArrowLeft', KeyD:'ArrowRight', KeyW:'ArrowUp', KeyS:'ArrowDown'}; // WASD aliases
window.addEventListener('keydown', e=>{
  const c = KEYMAP[e.code] || e.code;
  if (['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(c)) e.preventDefault();
  keys[c] = true;
  if (c === 'Space' || c === 'ArrowUp') pressJump();
});
window.addEventListener('keyup', e=>{ keys[KEYMAP[e.code] || e.code] = false; });

// ---- touch controls (mobile) ----
let TOUCH = window.matchMedia && matchMedia('(pointer: coarse)').matches;
const BTN = {
  left:  {x:70,  y:552, r:38, label:'◀'},
  right: {x:172, y:552, r:38, label:'▶'},
  jump:  {x:884, y:548, r:46, label:'▲'}
};
const touchHeld = {left:false, right:false};
function touchXY(t){
  const r = cv.getBoundingClientRect();
  return {x:(t.clientX-r.left)*W/r.width, y:(t.clientY-r.top)*H/r.height};
}
function inBtn(p, b){
  const dx = p.x-b.x, dy = p.y-b.y, rr = b.r*1.5; // forgiving hit area
  return dx*dx + dy*dy < rr*rr;
}
function recomputeHolds(e){
  touchHeld.left = false; touchHeld.right = false;
  for (const t of e.touches){
    const p = touchXY(t);
    if (inBtn(p, BTN.left)) touchHeld.left = true;
    else if (inBtn(p, BTN.right)) touchHeld.right = true;
  }
}
cv.addEventListener('touchstart', e=>{
  e.preventDefault();
  TOUCH = true;
  if (state === 'title' || state === 'victory'){ pressJump(); return; }
  for (const t of e.changedTouches){
    if (inBtn(touchXY(t), BTN.jump)) pressJump();
  }
  recomputeHolds(e);
}, {passive:false});
cv.addEventListener('touchmove', e=>{ e.preventDefault(); recomputeHolds(e); }, {passive:false});
cv.addEventListener('touchend', e=>{ e.preventDefault(); recomputeHolds(e); }, {passive:false});
cv.addEventListener('touchcancel', e=>{ recomputeHolds(e); });

// ===== Update =====
function predictLandX(b){
  const dy = FLOOR - BALL_R - b.y;
  const disc = b.vy*b.vy + 2*BALL_G*Math.max(0, dy);
  const tt = (-b.vy + Math.sqrt(disc)) / BALL_G;
  return b.x + b.vx*tt;
}

function update(dt){
  t += dt;
  for (const p of pops) p.age += dt;
  pops = pops.filter(p=>p.age < p.life);

  if (state === 'title' || state === 'victory'){
    if (state === 'victory'){
      for (const c of confetti){
        c.y += c.vy*dt; c.x += c.vx*dt + Math.sin(t*4+c.ph)*0.6; c.rot += c.vr*dt;
        if (c.y > H+20){ c.y = -20; c.x = Math.random()*W; }
      }
    }
    return;
  }
  if (state === 'replay'){
    replayIdx += 0.32;
    if (replayIdx >= replayBuf.length - 1){
      state = 'victory';
      confetti = [];
      for (let i=0;i<130;i++) confetti.push({x:Math.random()*W, y:Math.random()*-H, vy:120+Math.random()*160, vx:Math.random()*40-20, rot:Math.random()*7, vr:Math.random()*6-3, ph:Math.random()*7, col:['#ff7a1a','#1d62b8','#fff'][i%3]});
    }
    return;
  }

  // --- OG ---
  og.stun = Math.max(0, og.stun - dt);
  const inL = keys['ArrowLeft'] || touchHeld.left;
  const inR = keys['ArrowRight'] || touchHeld.right;
  if (og.stun <= 0 && (state === 'play' || state === 'resolve' || state === 'winpose')){
    const ax = 2600;
    if (inL){ og.vx -= ax*dt; og.facing = -1; }
    if (inR){ og.vx += ax*dt; og.facing = 1; }
  }
  if (!inL && !inR) og.vx *= Math.pow(0.0001, dt);
  og.vx = Math.max(-480, Math.min(480, og.vx));
  og.x += og.vx*dt;
  og.x = Math.max(20, Math.min(852, og.x));
  if (og.air){
    og.vy += G*dt; og.y += og.vy*dt;
    if (og.y >= FLOOR){ og.y = FLOOR; og.vy = 0; og.air = false; }
  }
  og.phase += Math.abs(og.vx)*dt*0.05;

  // --- Wemby ---
  wemby.cd = Math.max(0, wemby.cd - dt);
  let target = wemby.x;
  if (ball && ball.live){
    const land = predictLandX(ball);
    target = wemby.x + (Math.max(540, Math.min(766, land)) - wemby.x) * P.track;
  }
  if (!wemby.air){
    const dx = target - wemby.x;
    wemby.x += Math.max(-P.wspeed*dt, Math.min(P.wspeed*dt, dx));
    wemby.x = Math.max(520, Math.min(790, wemby.x));
    if (ball && ball.live && wemby.cd <= 0){
      const contestTip = ball.tipped && Math.abs(ball.x - wemby.x) < P.jumpDist && ball.y < 380;
      const contestOG  = og.air && og.vy < 0 && Math.abs(og.x - wemby.x) < P.jumpDist + 20;
      if (contestTip || contestOG){
        wemby.vy = -720; wemby.air = true;
      }
    }
  } else {
    wemby.vy += G*dt; wemby.y += wemby.vy*dt;
    if (wemby.y >= FLOOR){ wemby.y = FLOOR; wemby.vy = 0; wemby.air = false; wemby.cd = P.recover; }
  }

  // --- defenders ---
  for (const s of sticks){
    s.x += s.dir*s.speed*dt;
    if (s.x < s.x0){ s.x = s.x0; s.dir = 1; }
    if (s.x > s.x1){ s.x = s.x1; s.dir = -1; }
    if (og.air && og.vy > 0 && Math.abs(og.x - s.x) < 24 && og.y > FLOOR-120 && og.y < FLOOR-82){
      // Mario stomp: spring off the defender's head
      og.y = FLOOR-120;
      og.vy = -640;
      addPop('BOING!', s.x, FLOOR-140, 22, '#1d62b8', 0.5);
      sBoing();
    } else if (!og.air && og.stun <= 0 && Math.abs(og.x - s.x) < 26){
      og.vx = (og.x < s.x ? -1 : 1) * 320;
      og.stun = 0.35;
      addPop('OOF', s.x, FLOOR-110, 22, '#445', 0.6);
      sOof();
    }
  }

  // --- Ball ---
  if (ball){
    ball.tipCd = Math.max(0, ball.tipCd - dt);
    const prevY = ball.y;
    ball.vy += BALL_G*dt;
    ball.x += ball.vx*dt;
    ball.y += ball.vy*dt;

    // falling through the cylinder: a make only if OG tipped it —
    // an untouched rebound rattles back out (the shot already missed!)
    if (!ball.made && ball.vy > 0 && prevY <= RIM_Y && ball.y > RIM_Y &&
        ball.x > RIM_FRONT+15 && ball.x < RIM_BACK-15){
      if (ball.tipped){
        makeShot();
      } else {
        ball.y = RIM_Y; ball.hitRim = true;
        ball.vy = -Math.abs(ball.vy)*0.5 - 120;
        ball.vx = -(60 + Math.random()*140);
        sClank();
      }
    }

    // rim lips (skip if it just went in)
    if (!ball.made){
      for (const px of [RIM_FRONT, RIM_BACK]){
        const dx = ball.x - px, dy = ball.y - RIM_Y;
        const d = Math.hypot(dx, dy);
        if (d < BALL_R + 5 && d > 0.01){
          const nx = dx/d, ny = dy/d;
          ball.x = px + nx*(BALL_R+5); ball.y = RIM_Y + ny*(BALL_R+5);
          const dot = ball.vx*nx + ball.vy*ny;
          if (dot < 0){
            ball.vx -= 2*dot*nx; ball.vy -= 2*dot*ny;
            ball.vx *= 0.72; ball.vy *= 0.72;
            if (!ball.hitRim){
              // THE rebound — randomized off the iron
              ball.hitRim = true;
              if (Math.random() < 0.28){ // straight-up pop, drama
                ball.vx = (Math.random()*120-60) * P.reb;
                ball.vy = -(360+Math.random()*280) * P.reb;
              } else {
                ball.vx = -(70+Math.random()*240) * P.reb;
                ball.vy = -(200+Math.random()*380) * P.reb;
              }
            } else {
              ball.vx += Math.random()*80-40;
            }
            sClank();
          }
        }
      }
      // backboard
      if (ball.x + BALL_R > BOARD_X && ball.y > 128 && ball.y < 312 && ball.vx > 0){
        ball.x = BOARD_X - BALL_R; ball.vx = -Math.abs(ball.vx)*0.65; sBounce();
      }
    }
    if (ball.x < BALL_R){ ball.x = BALL_R; ball.vx = Math.abs(ball.vx)*0.7; }
    if (ball.x > W-BALL_R){ ball.x = W-BALL_R; ball.vx = -Math.abs(ball.vx)*0.7; }

    // floor
    if (ball.y + BALL_R > FLOOR){
      ball.y = FLOOR - BALL_R;
      if (Math.abs(ball.vy) > 60) sBounce();
      ball.vy = -Math.abs(ball.vy)*0.55;
      ball.vx *= 0.75;
      if (ball.live && state === 'play') endTry(ball.tipped ? 'miss' : 'dead');
    }

    // --- the TIP ---
    if (state === 'play' && ball.live && og.air && ball.tipCd <= 0 && ball.y < 370){
      const hx = og.x + og.facing*7, hy = og.y - 138;
      const dx = ball.x - hx, dy = ball.y - hy;
      if (dx*dx + dy*dy < (BALL_R+20)*(BALL_R+20)){
        const dist = Math.abs(RIM_CX - ball.x);
        const err = (dist/300)*(Math.random()*160-80) + dx*2.2;
        const T = 0.5 + dist/900;
        ball.vx = (RIM_CX + err - ball.x)/T;
        ball.vy = ((RIM_Y - 12 - ball.y) - 0.5*BALL_G*T*T)/T;
        ball.tipped = true; ball.tipCd = 0.35;
        sBoing();
        addPop('TIP!', ball.x, ball.y-30, 24, '#1d62b8', 0.5);
      }
    }

    // --- Wemby's swat (only mid-jump, and only against a tipped ball) ---
    if (state === 'play' && ball.live && !ball.made && wemby.air && ball.tipped){
      const whx = wemby.x, why = wemby.y - 212;
      const dx = ball.x - whx, dy = ball.y - why;
      if (dx*dx + dy*dy < (BALL_R+18)*(BALL_R+18)){
        ball.vx = Math.random()*120-60;
        ball.vy = 550;
        endTry('block');
      }
    }
  }

  // record replay frames during live play + winpose
  if (state === 'play' || state === 'winpose'){
    replayBuf.push({bx:ball.x, by:ball.y, made:ball.made, ox:og.x, oy:og.y, oa:og.air, of:og.facing, ph:og.phase, wx:wemby.x, wy:wemby.y, ds:sticks.map(s=>s.x)});
    if (replayBuf.length > 120) replayBuf.shift();
  }

  if (state === 'winpose'){
    winTimer -= dt;
    if (winTimer <= 0){ state = 'replay'; replayIdx = 0; sSlowmo(); }
  }
  if (state === 'resolve'){
    resolveTimer -= dt;
    if (resolveTimer <= 0) resetTry();
  }
}

// ===== Drawing =====
function wobblyText(text, x, y, size, color, rot){
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(rot || 0);
  ctx.font = 'bold ' + size + 'px "Comic Sans MS", "Chalkboard SE", cursive';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.lineWidth = Math.max(3, size/8); ctx.strokeStyle = '#fff'; ctx.lineJoin = 'round';
  let cx = -ctx.measureText(text).width/2;
  for (let i=0;i<text.length;i++){
    const ch = text[i], w2 = ctx.measureText(ch).width;
    const jy = Math.sin(t*3 + i*1.7)*size*0.06;
    ctx.strokeText(ch, cx+w2/2, jy);
    ctx.fillStyle = color;
    ctx.fillText(ch, cx+w2/2, jy);
    cx += w2;
  }
  ctx.restore();
}

function drawCourt(){
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#141a2a'; ctx.fillRect(0, 0, W, FLOOR);     // while the photo loads
  if (bgImg.complete) ctx.drawImage(bgImg, 0, 0, W, FLOOR);    // crunchy MSG crowd
  ctx.fillStyle = 'rgba(170,180,200,0.26)';                    // haze so the action pops
  ctx.fillRect(0, 0, W, FLOOR);
  ctx.fillStyle = '#10264a'; ctx.fillRect(0, 472, W, FLOOR-472); // courtside ad board
  ctx.fillStyle = '#cfd6e4'; ctx.font = 'bold 12px "Comic Sans MS", cursive'; ctx.textAlign = 'center';
  ctx.fillText('MADISON SQUARE GARDEN', W-170, 18);
  ctx.fillStyle = '#e8ecf5'; ctx.font = 'bold 18px "Comic Sans MS", cursive';
  ctx.fillText('THE GARDEN  ✶  NEW YORK  ✶  THE GARDEN', W/2, 512);
  ctx.fillStyle = '#d9b97a'; ctx.fillRect(0,FLOOR,W,H-FLOOR);  // floor
  ctx.strokeStyle = '#b08d4f'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(0, FLOOR+4); ctx.lineTo(W, FLOOR+2); ctx.stroke(); // wobbly baseline
  ctx.beginPath(); ctx.moveTo(620, FLOOR+30); ctx.quadraticCurveTo(740, FLOOR+18, 870, FLOOR+34); ctx.stroke(); // crude paint line
  // support arm
  ctx.strokeStyle = '#8a8f96'; ctx.lineWidth = 16;
  ctx.beginPath(); ctx.moveTo(W, 240); ctx.quadraticCurveTo(920, 215, BOARD_X+10, 218); ctx.stroke();
  // backboard
  ctx.fillStyle = '#b9bfc4'; ctx.fillRect(BOARD_X, 128, 22, 184);
  ctx.fillStyle = '#6c7177'; ctx.fillRect(BOARD_X-160, 118, 160+22, 14); // crude top of glass like screenshot
  ctx.strokeStyle = '#3c4147'; ctx.lineWidth = 4;
  ctx.strokeRect(BOARD_X-158, 122, 178, 188);
  ctx.beginPath(); ctx.moveTo(BOARD_X-100, 122); ctx.lineTo(BOARD_X-104, 310); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(BOARD_X-40, 122); ctx.lineTo(BOARD_X-36, 310); ctx.stroke();
  // rim
  ctx.strokeStyle = '#e8742a'; ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(RIM_FRONT-4, RIM_Y); ctx.lineTo(RIM_BACK+4, RIM_Y); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(RIM_CX, RIM_Y, (RIM_BACK-RIM_FRONT)/2+4, 7, 0, 0, Math.PI*2); ctx.stroke();
  // scribbly net
  ctx.strokeStyle = '#f4f4f4'; ctx.lineWidth = 2;
  for (let i=0;i<6;i++){
    const x0 = RIM_FRONT + 6 + i*((RIM_BACK-RIM_FRONT-12)/5);
    ctx.beginPath(); ctx.moveTo(x0, RIM_Y+4);
    ctx.quadraticCurveTo(x0 + (i<3?10:-10), RIM_Y+26, RIM_CX + (x0-RIM_CX)*0.45, RIM_Y+48);
    ctx.stroke();
  }
  for (let j=1;j<3;j++){
    ctx.beginPath();
    ctx.moveTo(RIM_FRONT+8+j*4, RIM_Y+j*15);
    ctx.quadraticCurveTo(RIM_CX, RIM_Y+j*15+8, RIM_BACK-8-j*4, RIM_Y+j*15);
    ctx.stroke();
  }
}

function drawBallAt(x, y){
  ctx.fillStyle = '#e8842a';
  ctx.beginPath(); ctx.arc(x, y, BALL_R, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-BALL_R, y); ctx.lineTo(x+BALL_R, y); ctx.stroke();
  ctx.beginPath(); ctx.arc(x-BALL_R*0.9, y, BALL_R*0.9, -0.9, 0.9); ctx.stroke();
  ctx.beginPath(); ctx.arc(x+BALL_R*0.9, y, BALL_R*0.9, Math.PI-0.9, Math.PI+0.9); ctx.stroke();
}

function drawOG(x, y, air, facing, phase, scale){
  const s = scale || 1;
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.lineCap = 'round';
  // legs
  ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 5;
  if (air){
    ctx.beginPath(); ctx.moveTo(-6,-40); ctx.lineTo(-16,-18); ctx.lineTo(-8,-2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(6,-40); ctx.lineTo(16,-22); ctx.lineTo(24,-8); ctx.stroke();
  } else {
    const sw = Math.sin(phase)*12;
    ctx.beginPath(); ctx.moveTo(-4,-40); ctx.lineTo(-6+sw,-20); ctx.lineTo(-8+sw,0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(4,-40); ctx.lineTo(6-sw,-20); ctx.lineTo(8-sw,0); ctx.stroke();
  }
  // shorts
  ctx.fillStyle = '#fff'; ctx.fillRect(-13,-52,26,14);
  ctx.strokeStyle = '#1d62b8'; ctx.lineWidth = 2; ctx.strokeRect(-13,-52,26,14);
  // torso / jersey
  ctx.fillStyle = '#fdfdfd'; ctx.fillRect(-16,-82,32,32);
  ctx.strokeStyle = '#bbb'; ctx.lineWidth = 1.5; ctx.strokeRect(-16,-82,32,32);
  ctx.fillStyle = '#e8742a'; ctx.font = 'bold 7px "Comic Sans MS", cursive'; ctx.textAlign='center';
  ctx.fillText('New York', 0, -74);
  ctx.font = 'bold 16px "Comic Sans MS", cursive'; ctx.fillStyle = '#1d62b8';
  ctx.fillText('8', 0, -57);
  // arms
  ctx.strokeStyle = '#8a5a3b'; ctx.lineWidth = 5;
  if (air){
    ctx.beginPath(); ctx.moveTo(-12,-78); ctx.lineTo(-10,-108); ctx.lineTo(facing*7-2,-134); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12,-78); ctx.lineTo(10,-108); ctx.lineTo(facing*7+2,-134); ctx.stroke();
    ctx.fillStyle = '#8a5a3b';
    ctx.beginPath(); ctx.arc(facing*7,-138,10,0,Math.PI*2); ctx.fill(); // big tipping mitt
  } else {
    const sw = Math.sin(phase)*10;
    ctx.beginPath(); ctx.moveTo(-12,-78); ctx.lineTo(-16-sw*0.4,-62); ctx.lineTo(-14-sw,-48); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(12,-78); ctx.lineTo(16+sw*0.4,-62); ctx.lineTo(14+sw,-48); ctx.stroke();
    ctx.fillStyle = '#8a5a3b';
    ctx.beginPath(); ctx.arc(-14-sw,-47,7,0,Math.PI*2); ctx.fill();   // big hands
    ctx.beginPath(); ctx.arc(14+sw,-47,7,0,Math.PI*2); ctx.fill();
  }
  // head
  ctx.fillStyle = '#8a5a3b';
  ctx.beginPath(); ctx.arc(0,-95,13,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#161616'; ctx.fillRect(-14,-112,28,9); // flat top
  ctx.fillRect(-14,-104,4,6); ctx.fillRect(10,-104,4,6);
  // angry face
  ctx.fillStyle = '#fff';
  ctx.fillRect(facing*2-6,-97,4,3); ctx.fillRect(facing*2+3,-97,4,3);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(facing*2-7,-101); ctx.lineTo(facing*2-1,-98); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(facing*2+8,-101); ctx.lineTo(facing*2+2,-98); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(facing*2-4,-88); ctx.lineTo(facing*2+4,-89); ctx.stroke();
  ctx.restore();
}

  ctx.beginPath(); ctx.arc(0,-212,6,0,Math.PI*2); ctx.fill();
  // head
  ctx.beginPath(); ctx.arc(0,-165,12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#2b2118'; ctx.fillRect(-12,-179,24,8);
  // blank menacing stare
  ctx.fillStyle = '#000';
  ctx.fillRect(-7,-168,3,3); ctx.fillRect(4,-168,3,3);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.moveTo(-4,-158); ctx.lineTo(4,-158); ctx.stroke();
  ctx.restore();
}

function drawSpur(x, y, num, skin){
  // a real cartoon Spur in the Wemby style: defensive stance, arms out, shuffling
  ctx.save(); ctx.translate(x, y); ctx.lineCap='round';
  const sh = Math.sin(t*7 + x)*6; // defensive shuffle
  // bent wide-stance legs
  ctx.strokeStyle = skin; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-6,-38); ctx.lineTo(-16+sh,-20); ctx.lineTo(-18+sh,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(6,-38); ctx.lineTo(16+sh,-20); ctx.lineTo(18+sh,0); ctx.stroke();
  // shorts
  ctx.fillStyle = '#1a1a1a'; ctx.fillRect(-13,-50,26,14);
  // jersey
  ctx.fillStyle = '#262626'; ctx.fillRect(-16,-80,32,30);
  ctx.fillStyle = '#cfcfcf'; ctx.font = 'bold 7px "Comic Sans MS", cursive'; ctx.textAlign='center';
  ctx.fillText('Spurs', 0, -72);
  ctx.font = 'bold 15px "Comic Sans MS", cursive';
  ctx.fillText(num, 0, -56);
  // arms spread wide on defense
  ctx.strokeStyle = skin; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-13,-76); ctx.lineTo(-28,-84); ctx.lineTo(-40,-96+sh); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(13,-76); ctx.lineTo(28,-84); ctx.lineTo(40,-96-sh); ctx.stroke();
  ctx.fillStyle = skin;
  ctx.beginPath(); ctx.arc(-41,-98+sh,4,0,Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(41,-98-sh,4,0,Math.PI*2); ctx.fill();
  // head
  ctx.beginPath(); ctx.arc(0,-93,13,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#161616';
  if (num === '5'){ ctx.fillRect(-13,-109,26,8); }                       // Castle: short crop
  else { ctx.beginPath(); ctx.arc(0,-100,13,Math.PI,0); ctx.fill(); }    // Harper: curly mop
  // determined face
  ctx.fillStyle = '#fff'; ctx.fillRect(-7,-95,4,3); ctx.fillRect(3,-95,4,3);
  ctx.strokeStyle = '#000'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(-8,-99); ctx.lineTo(-2,-97); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(8,-99); ctx.lineTo(2,-97); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(-4,-86); ctx.lineTo(4,-86); ctx.stroke();
  ctx.restore();
}

function drawBrunson(x, y){
  // Jalen Brunson #11, frozen in shooting follow-through — this miss is HIS
  ctx.save(); ctx.translate(x, y); ctx.scale(0.85, 0.85);
  ctx.lineCap='round';
  ctx.strokeStyle = '#2a2a2a'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(-4,-40); ctx.lineTo(-8,-20); ctx.lineTo(-12,0); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(4,-40); ctx.lineTo(10,-22); ctx.lineTo(14,0); ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.fillRect(-13,-52,26,14);
  ctx.fillStyle = '#fdfdfd'; ctx.fillRect(-16,-82,32,32);
  ctx.fillStyle = '#e8742a'; ctx.font = 'bold 7px "Comic Sans MS", cursive'; ctx.textAlign='center';
  ctx.fillText('New York', 0, -74);
  ctx.font = 'bold 15px "Comic Sans MS", cursive'; ctx.fillStyle = '#1d62b8';
  ctx.fillText('11', 0, -57);
  // follow-through: right arm up toward the hoop, wrist flicked
  ctx.strokeStyle = '#7d4f33'; ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(12,-78); ctx.lineTo(26,-104); ctx.lineTo(34,-126); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(34,-126); ctx.lineTo(44,-122); ctx.stroke(); // flicked wrist
  ctx.beginPath(); ctx.moveTo(-12,-78); ctx.lineTo(-18,-64); ctx.lineTo(-16,-50); ctx.stroke();
  ctx.fillStyle = '#7d4f33';
  ctx.beginPath(); ctx.arc(0,-95,13,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#161616'; ctx.fillRect(-13,-110,26,7);
  ctx.fillRect(-9,-88,18,6); // beard
  ctx.fillStyle = '#fff'; ctx.fillRect(-5,-98,4,3); ctx.fillRect(5,-98,4,3);
  ctx.restore();
}

function drawScoreboard(won){
  ctx.fillStyle = '#33363d';
  ctx.fillRect(W/2-150, 8, 300, 34);
  ctx.strokeStyle = '#111'; ctx.lineWidth = 2; ctx.strokeRect(W/2-150, 8, 300, 34);
  ctx.font = 'bold 17px "Comic Sans MS", cursive'; ctx.textAlign = 'center'; ctx.textBaseline='middle';
  ctx.fillStyle = '#ff9d4d';
  ctx.fillText('NYK ' + (won ? 107 : 105), W/2-85, 26);
  ctx.fillStyle = '#ddd';
  ctx.fillText('SAS 106', W/2+10, 26);
  ctx.fillStyle = '#7ee07e'; ctx.font = 'bold 13px "Comic Sans MS", cursive';
  ctx.fillText('Q4 0:00.5', W/2+100, 26);
}

function drawHUD(){
  const x = 24, y = 26;
  ctx.fillStyle = '#e8842a';
  ctx.beginPath(); ctx.arc(x, y, 9, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#111'; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.beginPath(); ctx.moveTo(x-9, y); ctx.lineTo(x+9, y); ctx.stroke();
  ctx.fillStyle = '#e8ecf5'; ctx.font = 'bold 16px "Comic Sans MS", cursive'; ctx.textAlign='left';
  ctx.fillText('ATTEMPT ' + triesUsed, 42, 31);
}

function drawScene(s){
  drawCourt();
  drawBrunson(BRUNSON_X, FLOOR);
  for (let i=0;i<sticks.length;i++){
    const d = sticks[i];
    drawSpur(s ? s.ds[i] : d.x, FLOOR, d.num, d.skin);
  }
  drawWemby(s ? s.wx : wemby.x, s ? s.wy : wemby.y);
  drawOG(s ? s.ox : og.x, s ? s.oy : og.y, s ? s.oa : og.air, s ? s.of : og.facing, s ? s.ph : og.phase, 1);
  drawBallAt(s ? s.bx : ball.x, s ? s.by : ball.y);
}

function drawPops(){
  for (const p of pops){
    const k = Math.min(1, p.age/0.12); // pop-in scale
    ctx.save();
    ctx.globalAlpha = p.age > p.life-0.25 ? Math.max(0,(p.life-p.age)/0.25) : 1;
    wobblyTextScaled(p.text, p.x, p.y, p.size*(0.5+0.5*k), p.color, p.rot);
    ctx.restore();
  }
}
function wobblyTextScaled(text,x,y,size,color,rot){ wobblyText(text,x,y,size,color,rot); }

function draw(){
  ctx.clearRect(0,0,W,H);

  if (state === 'title'){
    drawCourt();
    drawBrunson(140, FLOOR);
    drawWemby(700, FLOOR);
    drawOG(420, FLOOR, true, 1, 0, 1.6);
    drawBallAt(455, FLOOR-265);
    ctx.fillStyle = 'rgba(154,163,184,0.55)'; ctx.fillRect(0,0,W,H);
    wobblyText('OG TIP IN', W/2, 130, 84, '#ff7a1a', -0.03);
    wobblyText('2026 NBA FINALS — GAME 4', W/2, 195, 24, '#1d62b8', 0.02);
    ctx.font = 'bold 19px "Comic Sans MS", cursive'; ctx.textAlign='center'; ctx.fillStyle = '#222';
    if (TOUCH){
      ctx.fillText('hold ◀ ▶  to run in from half court', W/2, 340);
      ctx.fillText('tap ▲  to jump — touch the ball near the rim to tip it in', W/2, 374);
      if (Math.floor(t*2)%2===0) wobblyText('TAP TO START', W/2, 480, 34, '#d22', 0);
    } else {
      ctx.fillText('← → / A D  run in from half court', W/2, 340);
      ctx.fillText('SPACE / W  jump — touch the ball near the rim to tip it in', W/2, 374);
      if (Math.floor(t*2)%2===0) wobblyText('PRESS SPACE TO START', W/2, 480, 34, '#d22', 0);
    }
    return;
  }

  if (state === 'replay'){
    const s = replayBuf[Math.floor(replayIdx)];
    if (s) drawScene(s);
    ctx.fillStyle = 'rgba(255,255,255,0.06)'; ctx.fillRect(0,0,W,H);
    if (Math.floor(t*6)%2===0) wobblyText('INSTANT REPLAY', 160, 70, 28, '#d22', -0.05);
    drawScoreboard(false);
    return;
  }

  if (state === 'victory'){
    const s = replayBuf[replayBuf.length-1];
    if (s) drawScene(s);
    ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(0,0,W,H);
    for (const c of confetti){
      ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(c.rot);
      ctx.fillStyle = c.col; ctx.fillRect(-5,-3,10,6);
      ctx.restore();
    }
    drawScoreboard(true);
    wobblyText('KNICKS WIN GAME 4', W/2, 200, 64, '#ff7a1a', -0.02);
    wobblyText('OG WITH THE TIP!!', W/2, 270, 34, '#1d62b8', 0.02);
    wobblyText('it took ' + triesUsed + (triesUsed===1?' attempt':' attempts'), W/2, 330, 24, '#33363d', 0);
    if (Math.floor(t*2)%2===0) wobblyText(TOUCH ? 'TAP TO RUN IT BACK' : 'PRESS SPACE TO RUN IT BACK', W/2, 460, 26, '#d22', 0);
    return;
  }

  // play / resolve / winpose
  drawScene(null);
  drawScoreboard(false);
  drawHUD();
  drawPops();
  if (TOUCH) drawTouchButtons();
}

function drawTouchButtons(){
  for (const k of ['left','right','jump']){
    const b = BTN[k];
    const held = (k==='left' && touchHeld.left) || (k==='right' && touchHeld.right);
    ctx.globalAlpha = held ? 0.55 : 0.28;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#222'; ctx.lineWidth = 3; ctx.stroke();
    ctx.fillStyle = '#222'; ctx.font = 'bold 30px "Comic Sans MS", cursive';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(b.label, b.x, b.y+2);
  }
  ctx.globalAlpha = 1;
}

// ===== Main loop (fixed timestep) =====
let last = performance.now(), acc = 0;
const STEP = 1/120;
function frame(now){
  let dt = Math.min(0.05, (now-last)/1000);
  last = now;
  acc += dt;
  while (acc >= STEP){ update(STEP); acc -= STEP; }
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
